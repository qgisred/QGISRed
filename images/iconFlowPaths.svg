<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Trayectos aguas arriba (azul) convergiendo en el nudo -->
  <path d="M 8 12 L 32 32 M 8 52 L 32 32" fill="none" stroke="#60bcd3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="14,24 21,23 20,16" fill="none" stroke="#60bcd3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="14,40 21,41 20,48" fill="none" stroke="#60bcd3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Trayectos aguas abajo (verde) saliendo del nudo -->
  <path d="M 32 32 L 56 12 M 32 32 L 56 52" fill="none" stroke="#7fa828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="43,16 50,17 49,24" fill="none" stroke="#7fa828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="43,48 50,47 49,40" fill="none" stroke="#7fa828" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nudo seleccionado -->
  <circle cx="32" cy="32" r="7" fill="#ffffff" stroke="#60bcd3" stroke-width="4" />
</svg>
