<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clock face (constant time reference) -->
  <circle cx="26" cy="30" r="21" fill="none" stroke="#60bcd3" stroke-width="6"/>
  <!-- Hour hand -->
  <line x1="26" y1="30" x2="26" y2="16" stroke="#7fa828" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="26" y1="30" x2="38" y2="36" stroke="#7fa828" stroke-width="4" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="26" cy="30" r="3.5" fill="#7fa828"/>
  <!-- Equals sign: fixed real-time ratio -->
  <line x1="50" y1="49" x2="62" y2="49" stroke="#7fa828" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="59" x2="62" y2="59" stroke="#7fa828" stroke-width="6" stroke-linecap="round"/>
</svg>
