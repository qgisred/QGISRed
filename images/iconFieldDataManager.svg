<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tabla de cobertura de datos (azul) -->
  <rect x="8" y="10" width="48" height="36" rx="4" fill="none" stroke="#60bcd3" stroke-width="4" />
  <line x1="8" y1="22" x2="56" y2="22" stroke="#60bcd3" stroke-width="2" />
  <line x1="8" y1="34" x2="56" y2="34" stroke="#60bcd3" stroke-width="2" />
  <line x1="24" y1="10" x2="24" y2="46" stroke="#60bcd3" stroke-width="2" />
  <line x1="40" y1="10" x2="40" y2="46" stroke="#60bcd3" stroke-width="2" />

  <!-- Celdas con datos (verde) y una vacia -->
