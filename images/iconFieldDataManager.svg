    <rect x="12" y="14" width="8" height="4" rx="1" />
    <rect x="28" y="14" width="8" height="4" rx="1" />
    <rect x="44" y="14" width="8" height="4" rx="1" />
    <rect x="12" y="26" width="8" height="4" rx="1" />
    <rect x="44" y="26" width="8" height="4" rx="1" />
    <rect x="28" y="38" width="8" height="4" rx="1" />
    <rect x="44" y="38" width="8" height="4" rx="1" />
  </g>
  <rect x="12" y="38" width="8" height="4" rx="1" fill="none" stroke="#7fa828" stroke-width="1.5" />

  <!-- Almacen de datos (cilindro) bajo la tabla -->
  <path d="M 20 52 L 20 58 C 20 60 44 60 44 58 L 44 52" fill="none" stroke="#60bcd3" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="32" cy="52" rx="12" ry="3" fill="none" stroke="#60bcd3" stroke-width="3" />
</svg>
